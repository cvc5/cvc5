name: Publish 1.4.2 to Maven Central (one-off)

# One-off workflow to publish cvc5 1.4.2 to Maven Central, whose publication
# failed in the release CI run: the runner image had moved to Maven 3.10.0, with
# which central-publishing-maven-plugin leaves maven-metadata-local.xml and
# _remote.repositories in the bundle, and Central rejects it ("Bundle has
# content that does NOT have a .pom file").
#
# Instead of rebuilding cvc5, the Maven artifacts are reconstructed from the
# cvc5-1.4.2 release assets and sources, the same way as in the release CI run
# (this reproduces the 1.4.1 artifacts on Maven Central exactly):
# - cvc5-<os>-<arch>.jar: the JNI library (cvc5-libs/) in the release
#   cvc5-<OS>-<arch>-java-api.jar, built from the same static build.
# - cvc5.jar: the classes (io/) in cvc5-Linux-x86_64-java-api.jar, which comes
#   from the ubuntu:unrestricted build (Java 8), as in the release CI run.
# - cvc5-sources.jar, cvc5-javadoc.jar: built with Java 21 from the sources and
#   the generated Java files, with the same commands as the CMake targets.
# - pom.xml: generated by configure.
#
# The deployment is uploaded with autoPublish=false: it has to be published
# manually at https://central.sonatype.com/publishing/deployments after
# checking it.

on:
  push:
    branches: [publish-maven-1.4.2]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    if: github.repository == 'cvc5/cvc5'
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: cvc5-1.4.2
      VERSION: 1.4.2
      MAVEN_VERSION: 3.9.16
      MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
    steps:
    - uses: actions/checkout@v6

    - name: Check that the sources match the release tag
      run: |
        git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
        # Only .github/ may differ from the tag
        if git diff --name-only "${RELEASE_TAG}" HEAD | grep -v '^\.github/'; then
          echo "::error::Sources differ from ${RELEASE_TAG}"; exit 1
        fi

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Generate the Java sources and the POM
      run: |
        ./configure.sh unrestricted --java-bindings --auto-download --name=build
        make -C build generate-java-kinds generate-java-proofrules \
          generate-java-skolemfunids generate-java-types gen-options
        grep -q "<version>${VERSION}</version>" build/pom.xml

    - name: Download the release JARs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir release
        gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir release \
          -p cvc5-Linux-x86_64-java-api.jar -p cvc5-Linux-arm64-java-api.jar \
          -p cvc5-macOS-x86_64-java-api.jar -p cvc5-macOS-arm64-java-api.jar \
          -p cvc5-Win64-x86_64-java-api.jar -p cvc5-Win64-arm64-java-api.jar
        ls -l release

    - name: Create cvc5.jar and the native JARs (Java 8)
      run: |
        mkdir -p maven/src/api/java maven/docs/api/java
        while read -r asset os arch lib; do
          rm -rf tmp && mkdir tmp
          (cd tmp && jar xf "../release/${asset}" cvc5-libs)
          test "$(find tmp -type f)" = "tmp/cvc5-libs/${os}/${arch}/${lib}"
          jar cf "maven/src/api/java/cvc5-${os}-${arch}.jar" -C tmp cvc5-libs
        done <<'EOF'
        cvc5-Linux-x86_64-java-api.jar linux x86_64 libcvc5jni.so
        cvc5-Linux-arm64-java-api.jar linux aarch_64 libcvc5jni.so
        cvc5-macOS-x86_64-java-api.jar osx x86_64 libcvc5jni.dylib
        cvc5-macOS-arm64-java-api.jar osx aarch_64 libcvc5jni.dylib
        cvc5-Win64-x86_64-java-api.jar windows x86_64 cvc5jni.dll
        cvc5-Win64-arm64-java-api.jar windows aarch_64 cvc5jni.dll
        EOF
        rm -rf tmp && mkdir tmp
        (cd tmp && jar xf ../release/cvc5-Linux-x86_64-java-api.jar io)
        # The classes must be Java 8 class files (major version 52)
        find tmp -name '*.class' -print0 | while IFS= read -r -d '' c; do
          test "$(od -An -j6 -N2 -tu1 "$c" | tr -s ' ')" = " 0 52"
        done
        jar cf maven/src/api/java/cvc5.jar -C tmp io
        rm -rf tmp

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Create cvc5-sources.jar and cvc5-javadoc.jar (Java 21)
      run: |
        # Same commands as the cvc5-sources-jar and docs-java-javadoc targets
        jar cf maven/src/api/java/cvc5-sources.jar \
          -C src/api/java io/github/cvc5 -C build/src/api/java io/github/cvc5
        javadoc io.github.cvc5 -Xdoclint:all -Xmaxwarns 1000 \
          -sourcepath src/api/java/:build/src/api/java/ -d javadoc \
          -cp maven/src/api/java/cvc5.jar \
          -tag "api.note:a:Note:" --allow-script-in-comments \
          -header "$(cat .github/publish-maven/javadoc-header.txt)" \
          -notimestamp -subpackages io.github.cvc5.modes
        find javadoc -type f -exec sed -i'orig' 's/<!-- Generated by javadoc [^>]* -->//' {} \;
        find javadoc -name '*orig' -delete
        jar cf maven/docs/api/java/cvc5-javadoc.jar -C javadoc .

    - name: Prepare the POM
      run: |
        # Upload without publishing, so that the deployment can be checked first
        sed 's#<autoPublish>true</autoPublish>#<autoPublish>false</autoPublish>#' \
          build/pom.xml > maven/pom.xml
        grep -q '<autoPublish>false</autoPublish>' maven/pom.xml
        find maven -type f | sort

    - name: Keep the Maven artifacts
      uses: actions/upload-artifact@v6
      with:
        name: maven-${{ env.VERSION }}
        path: maven/

    - name: Set up Maven Central
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_TOKEN
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Install Maven ${{ env.MAVEN_VERSION }}
      run: |
        # Maven 3.10 breaks the bundle created by central-publishing-maven-plugin
        tarball="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        curl -fsSLO "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/${tarball}"
        echo "${MAVEN_SHA512}  ${tarball}" | sha512sum -c -
        tar xzf "${tarball}" -C "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

    - name: Deploy to Maven Central
      run: |
        mvn --version | grep -q "Apache Maven ${MAVEN_VERSION} "
        cd maven
        mvn deploy --batch-mode -Prelease
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
