on:
  push:
    branches:
      - main
    paths:
      - 'proofs/eo/**'
      - 'contrib/check-logos-compilation'
      - '.github/workflows/cpc_logos.yml'
  pull_request:
    # Keep in sync with the push filter above; GitHub Actions does not support
    # YAML anchors.
    paths:
      - 'proofs/eo/**'
      - 'contrib/check-logos-compilation'
      - '.github/workflows/cpc_logos.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail if the pinned Logos is out of date'
        type: boolean
        default: true

name: cpc-logos

concurrency:
  group: cpc-logos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.repository != 'cvc5/cvc5' || startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  check-logos-compilation:
    name: Check CPC against pinned Logos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ethos-eoc is a cmake/C++17 project and needs the GMP headers. Nothing
      # else here builds or runs cvc5: what is compiled is the Eunoia source
      # text of proofs/eo/cpc.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      # The pinned Logos commit and, transitively, the ethos commit it pins are
      # both fixed by contrib/check-logos-compilation, so its hash is the whole
      # cache key.
      # Restore and save are separate so that a failed install is not written
      # to the cache, where it would be restored by every later run under a key
      # that nothing invalidates.
      - name: Restore CPC compiler cache
        id: cpc-compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: deps/cpc-compiler
          key: ${{ runner.os }}-cpc-compiler-${{ hashFiles('contrib/check-logos-compilation') }}

      # The check sets the compiler up itself when it is not there, but doing
      # it as its own step is what lets the cache be saved separately from the
      # check's own outcome.
      - name: Install the Eunoia compiler and the pinned Logos
        if: steps.cpc-compiler-cache.outputs.cache-hit != 'true'
        run: ./contrib/check-logos-compilation --setup-only

      - name: Save CPC compiler cache
        if: success() && steps.cpc-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: deps/cpc-compiler
          key: ${{ runner.os }}-cpc-compiler-${{ hashFiles('contrib/check-logos-compilation') }}

      # Two outcomes, reported differently. A signature that does not compile
      # is a change to proofs/eo that the pull request can fix, so it fails the
      # job. A signature that compiles but is ahead of the pinned Logos cannot
      # be fixed in the pull request -- Logos has to be regenerated and the pin
      # moved afterwards -- so on a pull request and on main it is a warning,
      # and the nightly run is the one that fails, holding the drift visible
      # until the pin moves.
      - name: Check that CPC is in sync with the pinned Logos
        env:
          STRICT: ${{ (github.event_name == 'schedule' || inputs.strict) && '--strict' || '' }}
        run: |
          status=0
          ./contrib/check-logos-compilation ${STRICT} || status=$?
          if [ "${status}" -eq 2 ]; then
            echo "::warning title=CPC is ahead of the pinned Logos::proofs/eo/cpc no longer matches the Cpc package of the Logos commit pinned in contrib/check-logos-compilation. Regenerate Logos, then move LOGOS_VERSION."
            {
              echo "### CPC is ahead of the pinned Logos"
              echo
              echo "The signature compiles, but \`Cpc\` at the pinned Logos commit was"
              echo "generated from an older version of it. Regenerate Logos against this"
              echo "signature and move \`LOGOS_VERSION\` in \`contrib/check-logos-compilation\`."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          exit "${status}"
