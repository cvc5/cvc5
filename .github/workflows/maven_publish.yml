name: Publish to Maven Central

# Runs after the CI workflow, so that a failure to publish to Maven Central
# does not change the conclusion of the CI run (and, thus, does not prevent
# other workflows that depend on it, such as "Upload Docs", from running),
# while still being reported as a failed run.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  actions: write # download and delete the mvn-* artifacts of the CI run

jobs:
  publish-to-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Releases are tagged as cvc5-<version>; head_branch holds the tag name.
    if: >
      github.repository == 'cvc5/cvc5' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'cvc5-'))
    steps:
    - name: Set up Maven Central
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_TOKEN
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    # Use Maven 3.9 instead of the version of the runner image: with Maven
    # 3.10, central-publishing-maven-plugin (at least up to 0.11.0) leaves
    # maven-metadata-local.xml and _remote.repositories in the bundle, and
    # Maven Central rejects it ("Bundle has content that does NOT have a .pom
    # file"). This broke the publication of 1.4.2. The pin can be removed once
    # https://github.com/apache/maven/issues/13388 is fixed or the plugin
    # supports Maven 3.10.
    - name: Install Maven
      env:
        MAVEN_VERSION: 3.9.16
        MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
      run: |
        tarball="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        curl -fsSLO "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/${tarball}"
        echo "${MAVEN_SHA512}  ${tarball}" | sha512sum -c -
        tar xzf "${tarball}" -C "${RUNNER_TEMP}"
        rm "${tarball}"
        echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin/mvn" --version

    - name: Download Maven JAR artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./maven
        pattern: mvn-*
        merge-multiple: true
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to Maven Central
      id: deploy
      run: |
        cd ./maven
        mkdir -p ./src/api/java ./docs/api/java
        mv cvc5-javadoc.jar ./docs/api/java/
        mv *.jar ./src/api/java/
        mvn deploy --batch-mode -Prelease
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

    # Keep the artifacts if the deployment failed, so that it can be retried
    # (they expire after one day).
    - name: Delete mvn-* artifacts from the CI run
      if: steps.deploy.outcome == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI_RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        echo "Getting artifacts for run $CI_RUN_ID"
        gh api /repos/${{ github.repository }}/actions/runs/$CI_RUN_ID/artifacts \
          --jq '.artifacts[] | select(.name | startswith("mvn-")) | .id' \
          | while read id; do
            echo "Deleting artifact id $id"
            gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$id
          done
