name: Publish to Maven Central

# Runs after the CI workflow, so that a failure to publish to Maven Central
# does not change the conclusion of the CI run (and, thus, does not prevent
# other workflows that depend on it, such as "Upload Docs", from running),
# while still being reported as a failed run.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  actions: write # download and delete the mvn-* artifacts of the CI run

jobs:
  publish-to-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Releases are tagged as cvc5-<version>; head_branch holds the tag name.
    if: >
      github.repository == 'cvc5/cvc5' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'cvc5-'))
    steps:
    - name: Set up Maven Central
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_TOKEN
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Download Maven JAR artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./maven
        pattern: mvn-*
        merge-multiple: true
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to Maven Central
      id: deploy
      run: |
        cd ./maven
        mkdir -p ./src/api/java ./docs/api/java
        mv cvc5-javadoc.jar ./docs/api/java/
        mv *.jar ./src/api/java/
        mvn deploy --batch-mode -Prelease
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

    # Keep the artifacts if the deployment failed, so that it can be retried
    # (they expire after one day).
    - name: Delete mvn-* artifacts from the CI run
      if: steps.deploy.outcome == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI_RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        echo "Getting artifacts for run $CI_RUN_ID"
        gh api /repos/${{ github.repository }}/actions/runs/$CI_RUN_ID/artifacts \
          --jq '.artifacts[] | select(.name | startswith("mvn-")) | .id' \
          | while read id; do
            echo "Deleting artifact id $id"
            gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$id
          done
