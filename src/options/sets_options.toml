id     = "SETS"
name   = "Sets Theory"

[[option]]
  name       = "setsProxyLemmas"
  category   = "expert"
  long       = "sets-proxy-lemmas"
  type       = "bool"
  default    = "false"
  help       = "introduce proxy variables eagerly to shorten lemmas"

[[option]]
  name       = "setsExp"
  category   = "expert"
  long       = "sets-exp"
  type       = "bool"
  default    = "false"
  help       = "enable extended symbols such as complement and universe in theory of sets"

[[option]]
  name       = "relsExp"
  category   = "expert"
  long       = "rels-exp"
  type       = "bool"
  default    = "true"
  help       = "enable the relations extension of the theory of sets"

[[option]]
  name       = "setsCardExp"
  category   = "expert"
  long       = "sets-card-exp"
  type       = "bool"
  default    = "true"
  help       = "enable the cardinality extension of the theory of sets"

[[option]]
  name       = "setsToBags"
  category   = "expert"
  long       = "sets-to-bags=MODE"
  type       = "SetsToBagsMode"
  default    = "NONE"
  help       = "convert set terms to bag terms during preprocessing"
  help_mode  = "Modes for converting sets to bags."
[[option.mode.NONE]]
  name = "none"
  help = "Do not convert sets to bags."
[[option.mode.SETOF]]
  name = "setof"
  help = "Convert each set term to a bag term wrapped in bag.setof, which preserves the semantics of sets."
[[option.mode.RELAXED]]
  name = "relaxed"
  help = "Convert each set term to a bag term without bag.setof (except for set.union), which relaxes the semantics of sets to bags. The answers are for the resulting bag problem."
